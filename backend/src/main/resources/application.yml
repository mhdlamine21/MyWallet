spring:
  application:
    name: mywallet-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mywallet}
    username: ${DB_USER:mywallet}
    password: ${DB_PASSWORD:mywallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema - Hibernate never auto-generates DDL
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mywallet}
    password: ${RABBITMQ_PASSWORD:mywallet}

mywallet:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-never-use-in-prod-change-me}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ratelimit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
      window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:60000}
  marketdata:
    tick-interval-seconds: ${MARKET_TICK_INTERVAL_SECONDS:5}
    tick-interval-ms: ${MARKET_TICK_INTERVAL_MS:5000}
  strategy-execution:
    interval-ms: ${STRATEGY_EXECUTION_INTERVAL_MS:5000}
  detection:
    price-anomaly:
      z-score-threshold: ${PRICE_ANOMALY_Z_SCORE_THRESHOLD:4.0}
    behavior-anomaly:
      interval-ms: ${BEHAVIOR_ANOMALY_INTERVAL_MS:30000}
      anomaly-score-threshold: ${BEHAVIOR_ANOMALY_SCORE_THRESHOLD:0.65}
  demo:
    enabled: ${DEMO_MODE_ENABLED:false}
    reset-cron: ${DEMO_RESET_CRON:0 */6 * * *}
  disclaimer: >
    MyWallet is an educational simulator. No real orders are executed, no real money is
    involved, and nothing in this application constitutes financial advice.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: docker
# Same as default here - values are already driven by env vars above.
# This profile exists so docker-compose.yml can select it explicitly and so future
# docker-only overrides (e.g. different log format) have a clear home.

---
spring:
  config:
    activate:
      on-profile: demo
mywallet:
  demo:
    enabled: true
