version: "3.9"

# Full local development stack for MyWallet.
# For the lightweight cloud-demo profile, see docker-compose.prod-lite.yml.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mywallet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mywallet}
      POSTGRES_USER: ${POSTGRES_USER:-mywallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mywallet}
    ports:
      - "5432:5432"
    volumes:
      - mywallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mywallet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mywallet-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mywallet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mywallet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mywallet}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mywallet-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,seed
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-mywallet}
      DB_USER: ${POSTGRES_USER:-mywallet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mywallet}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-mywallet}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mywallet}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-file-never-commit-a-real-secret}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mywallet-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mywallet-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mywallet-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-mywallet}
    ports:
      - "3000:3000"
    volumes:
      - mywallet_grafana_data:/var/lib/grafana

volumes:
  mywallet_postgres_data:
  mywallet_grafana_data:
